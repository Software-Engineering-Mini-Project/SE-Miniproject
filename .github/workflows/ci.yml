name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  # Give every main push its own group so later merges cannot cancel its CI.
  # PRs cancel superseded runs.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run API and web unit and contract tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run all browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event_name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  real-api-e2e:
    name: real API critical journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_MODE: http
      NEXT_PUBLIC_API_BASE_URL: /api
      MONGODB_URI: mongodb://127.0.0.1:27017/task_manager_ci
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 7200
      CORS_ORIGIN: http://localhost:3100
      E2E_PORT: 3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/critical-journey.spec.mjs
      - name: Upload real API Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real-api-${{ github.event_name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
